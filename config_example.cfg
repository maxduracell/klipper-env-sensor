# =============================================
# klipper-env-sensor - Example Configuration
# =============================================

# =============================================================
# Basic BME680 on Octopus I2C (Most Common Setup)
# =============================================================
[env_sensor chamber]
sensor_type: bme680
i2c_mcu: mcu
i2c_bus: i2c1a
i2c_address: 118                    # 0x76 = 118, 0x77 = 119. Most are 118
sample_time: 3.0
iaq_algorithm: open_source
baseline_mode: adaptive             # "adaptive", "locked", or "manual"

# Virtual sensors that will appear in Mainsail/Fluidd
# These names are automatically created by the module
# temperature_sensor chamber_temp
# temperature_sensor chamber_humidity
# temperature_sensor chamber_pressure
# temperature_sensor chamber_iaq


# =============================================================
# Alternative: BME280 + SGP40 combination
# =============================================================
#[env_sensor chamber]
#sensor_type: bme280
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 118
#sample_time: 3.0
#enable_iaq: false                  # Disable IAQ if only using BME280

#[env_sensor voc]
#sensor_type: sgp40
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 89                     # SGP40 default is 0x59 = 89
#sample_time: 3.0


# =============================================================
# Using RP2040 / Pico as dedicated sensor MCU (Recommended for best placement)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme680
#i2c_mcu: rp2040                     # Name of your RP2040 mcu section
#i2c_bus: i2c0                       # Usually i2c0 on Pico
#i2c_address: 118
#sample_time: 3.0
#iaq_algorithm: open_source
#baseline_mode: adaptive


# =============================================================
# Optional Advanced Settings
# =============================================================
#iaq_algorithm: open_source         # Currently only option
#baseline_mode: locked              # Prevents automatic baseline drift adjustment
#sample_time: 2.0                   # How often to read the sensor (seconds)


# =============================================================
# Example Macro Usage
# =============================================================
