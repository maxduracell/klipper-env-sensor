# =============================================================
# klipper-env-sensor - Example Configuration
# Repository: https://github.com/maxduracell/klipper-env-sensor
# =============================================================

# =============================================================
# 1. RECOMMENDED: BME680 on Octopus v1.1
# =============================================================
[env_sensor chamber]
sensor_type: bme680
i2c_mcu: mcu
i2c_bus: i2c1a                    # Octopus v1.1 common I2C bus (PB8=SDA, PB9=SCL)
i2c_address: 118                  # Most BME680 modules are 0x76 = 118. Some are 0x77 = 119.
sample_time: 3.0
enable_iaq: True                  # Set to False to disable IAQ calculations
iaq_algorithm: open_source
baseline_mode: adaptive           # "adaptive" = slowly corrects sensor drift (recommended)
                                  # "locked" = uses fixed baseline for more stability


# =============================================================
# Dashboard Integration (Mainsail & Fluidd)
# =============================================================
# This module automatically registers virtual sensors with Klipper's 
# heaters module so they instantly populate on your dashboard 
# with ZERO manual configuration!
#
# Automatically registered sensors:
#   - chamber_temp       (Temperature in °C)
#   - chamber_humidity   (Relative Humidity in %)
#   - chamber_pressure   (Barometric Pressure in hPa)
#   - chamber_iaq        (Indoor Air Quality Index 0-500, if enable_iaq is True)


# =============================================================
# Values available in GCODE macros:
# =============================================================
# printer["env_sensor chamber"].temperature
# printer["env_sensor chamber"].humidity
# printer["env_sensor chamber"].pressure
# printer["env_sensor chamber"].iaq
# printer["env_sensor chamber"].gas_resistance
# printer["env_sensor chamber"].voc_index (only if utilizing SGP40)
# printer["env_sensor chamber"].baseline_gas


# =============================================================
# 2. Using RP2040 / Pico as dedicated sensor MCU (Recommended)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme680
#i2c_mcu: rp2040                    # Must match your [mcu rp2040] section name
#i2c_bus: i2c0                      # Most RP2040 boards use i2c0
#i2c_address: 118
#sample_time: 3.0
#enable_iaq: True
#baseline_mode: adaptive


# =============================================================
# 3. BME280 + SGP40 Combination (Very high accuracy)
# =============================================================
# SGP40 features live, dynamic compensation. The driver will automatically
# look up live temperature and humidity readings from the BME280 ("chamber")
# to continually optimize VOC calculations and prevent drift.
#
#[env_sensor chamber]
#sensor_type: bme280
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 118
#sample_time: 3.0

#[env_sensor voc]
#sensor_type: sgp40
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 89                    # SGP40 default = 0x59 = 89
#sample_time: 3.0


# =============================================================
# Example Macros
# =============================================================

[gcode_macro ENV_QUERY]
description: Query any env_sensor (change "chamber" to match your sensor name)
gcode:
    QUERY_ENV SENSOR={params.SENSOR|default("chamber")}

[gcode_macro CHAMBER_STATUS]
description: Show current chamber environmental status (change "chamber" to match your sensor name)
gcode:
    {% set sensor_name = params.SENSOR|default("chamber") %}
    {% set sensor = printer["env_sensor " ~ sensor_name] %}
    {% set iaq = sensor.iaq|float %}
    {% set temp = sensor.temperature|float %}
    {% set hum = sensor.humidity|float %}
    RESPOND TYPE=command MSG="Chamber IAQ: {iaq:.1f} | Temp: {temp:.1f}°C | Humidity: {hum:.1f}%"

# Example of how to query a differently named sensor:
# ENV_QUERY SENSOR=enclosure
# CHAMBER_STATUS SENSOR=enclosure


# =============================================================
# Moonraker Update Manager for klipper-env-sensor
# =============================================================

[update_manager klipper-env-sensor]
type: git_repo
path: ~/klipper-env-sensor
origin: https://github.com/maxduracell/klipper-env-sensor.git
primary_branch: main
managed_services: klipper
# Optional: Enable automatic restarts when the module is updated
# restart_on_update: True
