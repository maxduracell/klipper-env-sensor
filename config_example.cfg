# =============================================
# klipper-env-sensor - Example Configuration
# =============================================

# =============================================================
# 1. BME680 on Octopus v1.1 I2C (Common on Octopus builds)
# =============================================================
[env_sensor chamber]
sensor_type: bme680
i2c_mcu: mcu
i2c_bus: i2c1a                    # Octopus v1.1 common I2C bus (PB8/PB9)
i2c_address: 118                  # Most BME680 modules are 0x76 = 118
sample_time: 3.0
iaq_algorithm: open_source
baseline_mode: adaptive


# =============================================================
# 2. BME680 on RP2040 / Pico (Recommended for best sensor placement)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme680
#i2c_mcu: rp2040                   # Change to match your RP2040 mcu section name
#i2c_bus: i2c0                     # Most RP2040 boards use i2c0
#i2c_address: 118
#sample_time: 3.0
#iaq_algorithm: open_source
#baseline_mode: adaptive


# =============================================================
# 3. BME280 only (No VOC/IAQ)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme280
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 118
#sample_time: 3.0
#enable_iaq: false


# =============================================================
# 4. BME280 + SGP40 Combination (Popular high-quality setup)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme280
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 118
#sample_time: 3.0

#[env_sensor voc]
#sensor_type: sgp40
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 89                    # SGP40 default address is 0x59 = 89


# =============================================================
# Common Advanced Settings
# =============================================================
#sample_time: 2.5                  # How often to read the sensor (seconds)
#baseline_mode: locked             # Prevents automatic baseline adjustment (more stable)
#baseline_mode: adaptive           # Slowly adjusts baseline to fight sensor drift (default)
#iaq_algorithm: open_source        # Currently the only supported option


# =============================================================
# Useful Macros
# =============================================================
[gcode_macro QUERY_CHAMBER]
gcode:
    QUERY_ENV SENSOR=chamber
