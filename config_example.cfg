# =============================================
# klipper-env-sensor - Example Configuration
# =============================================
# Repository: https://github.com/maxduracell/klipper-env-sensor
# This file shows recommended configurations. Copy the section you want
# into your printer.cfg and modify as needed.

# =============================================================
# 1. RECOMMENDED: BME680 on Octopus I2C
# =============================================================
[env_sensor chamber]
sensor_type: bme680
i2c_mcu: mcu
i2c_bus: i2c1a                    # Common I2C bus on Octopus v1.1 (PB8=SDA, PB9=SCL)
i2c_address: 118                  # Most modules are 0x76 = 118. Some are 119.
sample_time: 3.0
iaq_algorithm: open_source
baseline_mode: adaptive           # "adaptive" = slowly corrects drift, "locked" = stable baseline

# Virtual sensors created automatically (visible in Mainsail/Fluidd):
#   chamber_temp
#   chamber_humidity
#   chamber_pressure
#   chamber_iaq

# =============================================================
# Values available in macros (use with {printer["env_sensor chamber"].<value>})
# =============================================================
# temperature          (°C)
# humidity             (%)
# pressure             (hPa)
# iaq                  (0-500 Indoor Air Quality index)
# gas_resistance       (Ohms) - raw BME680 gas value
# voc_index            (if using SGP40)
# baseline_gas         (current adaptive baseline)

# Example macro usage:
# {printer["env_sensor chamber"].iaq}
# {printer["env_sensor chamber"].temperature}
# {printer["env_sensor chamber"].humidity}


# =============================================================
# 2. Using RP2040/Pico as dedicated sensor board (Highly Recommended)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme680
#i2c_mcu: rp2040                    # Must match your [mcu rp2040] section name
#i2c_bus: i2c0                      # Most RP2040 boards use i2c0
#i2c_address: 118
#sample_time: 3.0
#iaq_algorithm: open_source
#baseline_mode: adaptive


# =============================================================
# 3. BME280 + SGP40 Combination (Excellent accuracy)
# =============================================================
#[env_sensor chamber]
#sensor_type: bme280
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 118
#sample_time: 3.0

#[env_sensor voc]
#sensor_type: sgp40
#i2c_mcu: mcu
#i2c_bus: i2c1a
#i2c_address: 89                    # SGP40 default = 0x59 = 89


# =============================================================
# Common Tuning Options
# =============================================================
#sample_time: 2.5                   # Read more frequently (default is 3.0)
#baseline_mode: locked              # Use this if you want very stable readings
#enable_iaq: false                  # Disable IAQ calculation if not needed


# =============================================================
# Useful Macros
# =============================================================
[gcode_macro QUERY_CHAMBER]
gcode:
    QUERY_ENV SENSOR=chamber
